services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: intilearn
      POSTGRES_PASSWORD: intilearn
      POSTGRES_DB: intilearn
    ports:
      # 5433 so it does not clash with a local Postgres on 5432.
      # 127.0.0.1 so other machines on the network cannot reach it.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
